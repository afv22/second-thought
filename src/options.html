<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Access Logger - Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <label for="sessionDuration">Session duration (minutes)</label>
    <input type="number" id="sessionDuration" min="1" max="120" value="15">

    <label for="serverUrl">Log server URL</label>
    <input type="url" id="serverUrl" placeholder="http://localhost:5000">

    <label>Tracked domains</label>
    <div class="domains-list" id="domainsList"></div>
    <div class="add-domain">
      <input type="text" id="newDomain" placeholder="example.com">
      <button id="addDomain">Add</button>
    </div>

    <div id="status" class="status"></div>

  </div>
  <script src="logger.js"></script>
  <script src="options.js"></script>
</body>
</html>
